# Production Profile Configuration

# H2 Database Configuration for Production (would typically use a real database)
spring.datasource.url=jdbc:h2:file:./data/proddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.h2.console.enabled=false

# JPA/Hibernate Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Data Initialization for Production
spring.sql.init.mode=never

# Logging Configuration for Production
logging.level.com.bootcamp.onlineschool=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN